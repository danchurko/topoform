name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  discovery:
    name: Skill discovery and clean install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install through Skills CLI in an isolated workspace
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/topoform-install"
          mkdir -p "$install_root"
          cd "$install_root"
          npx --yes skills add "$GITHUB_WORKSPACE" --skill topoform --copy --agent codex --yes
          mapfile -t discovered < <(find . -type f -path '*/topoform/SKILL.md' -print)
          test "${#discovered[@]}" -eq 1
          installed_root="$(dirname "${discovered[0]}")"
          test "$(sed -n 's/^name: *//p' "$installed_root/SKILL.md" | head -n 1)" = topoform
          python "$installed_root/scripts/diagram.py" doctor
          for model in "$installed_root"/examples/*.json; do
            python "$installed_root/scripts/diagram.py" validate "$model" >/dev/null
          done

  python:
    name: Python behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  integrity:
    name: Asset integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify manifests and package cleanliness inputs
        run: |
          python scripts/diagram.py doctor
          python scripts/diagram.py icons >/dev/null
          python scripts/release.py check

  showcase:
    name: Showcase model validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate every editable showcase
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for model in examples/*.json; do
            python scripts/diagram.py validate "$model"
            count=$((count + 1))
          done
          test "$count" -ge 5

  browser:
    name: Offline Chromium behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install browser test runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Install and run the complete browser acceptance seam
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/topoform-browser-install"
          mkdir -p "$install_root"
          cd "$install_root"
          npx --yes skills add "$GITHUB_WORKSPACE" --skill topoform --copy --agent codex --yes
          installed_root="$(dirname "$(find . -type f -path '*/topoform/SKILL.md' -print -quit)")"
          python "$installed_root/scripts/acceptance.py" --out "$RUNNER_TEMP/topoform-browser"
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topoform-browser-evidence
          path: ${{ runner.temp }}/topoform-browser
          if-no-files-found: ignore

  cleanliness:
    name: Release cleanliness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Reject internal and generated material
        run: python scripts/release.py check
